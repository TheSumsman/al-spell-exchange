# GitHub only supports these two keys. `contact_links` add extra buttons to the
# "New issue" chooser alongside the four templates in this directory.
blank_issues_enabled: true
contact_links:
  - name: Setup problem? Check the runbook first
    url: https://github.com/TheSumsman/al-spell-exchange/blob/main/SETUP.md
    about: A blank tab or #REF! after linking the form is almost always the "Repoint the response tab" step.
  - name: Numbers look wrong? Check them against the test plan
    url: https://github.com/TheSumsman/al-spell-exchange/blob/main/TESTPLAN.md
    about: Three test wizards with the exact expected gold and downtime at every step, so you can pin down what disagrees.
